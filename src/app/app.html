<header class="app-header">
  <a class="app-header__brand" routerLink="/">
    <span class="app-header__mark" aria-hidden="true">🧵</span>
    <span>{{ appName }}</span>
  </a>
  <nav class="app-header__nav" [attr.aria-label]="t().a11y.mainNav">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      {{ t().nav.lists }}
    </a>
    @if (!settings.simple()('templatesTab')) {
      <a routerLink="/vorlagen" routerLinkActive="is-active">{{ t().nav.templates }}</a>
    }
    <a routerLink="/einstellungen" routerLinkActive="is-active">{{ t().nav.settings }}</a>
    <a routerLink="/ueber" routerLinkActive="is-active">{{ t().nav.about }}</a>
  </nav>
</header>

<main class="app-main">
  <app-install-banner />
  <router-outlet />
</main>

<app-snackbar />
<app-first-run />
